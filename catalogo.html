<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital - Restaurante</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body style="background-color: var(--bg-dark); color: var(--text-main); font-family: sans-serif; margin: 0;">

    <header style="display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; border-bottom: 1px solid var(--glass-border);">
        <h1 style="margin: 0;">Restaurante<span style="color: var(--primary-orange);">.</span></h1>
        <span style="border: 1px solid var(--primary-orange); color: var(--primary-orange); padding: 5px 15px; border-radius: 20px; font-weight: bold;">Mesa #04</span>
    </header>

    <main style="padding: 40px;">
        <div style="text-align: center; margin-bottom: 40px;">
            <span style="color: var(--primary-orange); font-weight: bold; letter-spacing: 2px; font-size: 14px;">CATÁLOGO DIGITAL</span>
        </div>
        
        <!-- Contenedor dinámico donde se inyectan las tarjetas -->
        <div id="listado" style="display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 1200px; margin: 0 auto;">
            <!-- Las tarjetas se generan vía JavaScript -->
        </div>
    </main>

    <!-- Barra fija inferior de Mi Pedido -->
    <div style="position: fixed; bottom: 0; width: 100%; display: flex; justify-content: center; padding-bottom: 20px; pointer-events: none;">
        <div style="background-color: var(--primary-orange); display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; border-radius: 12px; width: 300px; font-weight: bold; pointer-events: auto; cursor: pointer; box-shadow: 0 10px 20px rgba(255,122,0,0.3);">
            <span>Mi pedido</span>
            <span>$0.00</span>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/api/v1/productos';
        const contenedorLista = document.getElementById('listado');

        function obtenerImagenPorNombre(nombre) {
            const nombreMin = nombre.toLowerCase();
            if (nombreMin.includes('milanesa')) return 'https://marubotana.tv/uploads/2026/03/milanesa-napolitana.webp';
            if (nombreMin.includes('pizza')) return 'https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=500&q=80';
            if (nombreMin.includes('hamburguesa') || nombreMin.includes('burger')) return 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=500&q=80';
            if (nombreMin.includes('galeto') || nombreMin.includes('pollo')) return 'https://images.unsplash.com/photo-1598514982205-f36b96d1e8d4?auto=format&fit=crop&w=500&q=80';
            if (nombreMin.includes('pasta') || nombreMin.includes('fideo')) return 'https://images.unsplash.com/photo-1473093295043-cdd812d0e601?auto=format&fit=crop&w=500&q=80';
            if (nombreMin.includes('ensalada')) return 'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=500&q=80';
            if (nombreMin.includes('picada') || nombreMin.includes('tabla')) return 'https://picadasxl.com/wp-content/uploads/2024/08/inicio.png';
            
            return 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=500&q=80'; 
        }

        async function obtenerCatálogo() {
            try {
                const respuesta = await fetch(API_URL);
                if (!respuesta.ok) throw new Error(`Error ${respuesta.status}`);

                const items = await respuesta.json();
                contenedorLista.innerHTML = '';

                if (items.length === 0) {
                    contenedorLista.innerHTML = '<p style="color: var(--text-muted);">No hay productos disponibles por el momento.</p>';
                    return;
                }

                items.forEach(item => {
                    const tarjeta = document.createElement('div');
                    tarjeta.className = 'product-card';
                    tarjeta.style.width = '300px'; 
                    tarjeta.innerHTML = `
                        <img src="${obtenerImagenPorNombre(item.nombre)}" 
                             alt="${item.nombre}" 
                             style="width: 100%; height: 180px; border-radius: 16px; object-fit: cover; margin-bottom: 12px;">
                        <div style="display: flex; flex-direction: column; flex-grow: 1;">
                            <span style="color: var(--primary-orange); font-size: 12px; font-weight: 700; text-transform: uppercase;">Recomendado</span>
                            <h3 style="color: var(--text-main); font-size: 18px; margin: 4px 0 12px 0;">${item.nombre}</h3>
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: auto;">
                                <span style="font-size: 20px; font-weight: 800; color: var(--text-main);">$${parseFloat(item.precio).toFixed(2)}</span>
                                <button class="btn-orange" title="Agregar al pedido" style="padding: 8px 16px; font-size: 14px;">
                                    + Agregar
                                </button>
                            </div>
                        </div>
                    `;
                    contenedorLista.appendChild(tarjeta);
                });
            } catch (error) {
                contenedorLista.innerHTML = '<p style="color: var(--error);">Fallo al cargar el menú digital.</p>';
            }
        }

        obtenerCatálogo();
    </script>
</body>
</html>
