<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Cocina - Savage Grill</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Estilos específicos para el layout de la cocina (Pantalla completa) */
        body { height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .kanban-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 20px 40px; flex-grow: 1; overflow: hidden; }
        .kanban-column { background: rgba(255,255,255,0.02); border: 1px solid var(--glass-border); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; }
        .kanban-header { padding: 20px; border-bottom: 1px solid var(--glass-border); text-align: center; font-weight: 900; font-size: 18px; letter-spacing: 1px; }
        .kanban-body { padding: 20px; flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        
        /* Tarjetas de comandas */
        .comanda-card { background: rgba(18,18,18,0.8); border: 1px solid var(--glass-border); border-radius: 12px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: transform 0.2s; }
        .comanda-card:hover { transform: translateY(-3px); }
        .comanda-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px dashed var(--text-muted); padding-bottom: 10px; }
        .mesa-badge { background: var(--primary-orange); color: white; padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 14px; }
        .tiempo-badge { color: var(--text-muted); font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 4px; }
        .item-pedido { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; color: var(--text-main); }
    </style>
</head>
<body style="background-color: var(--bg-dark); color: var(--text-main); margin: 0;">

    <!-- ==========================================================================
         CABECERA OPERATIVA (Solo lectura, sin navegación)
         ========================================================================== -->
    <header style="display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; border-bottom: 1px solid var(--glass-border); background: rgba(0,0,0,0.3);">
        <h1 class="logo-restaurante" style="font-size: 24px; margin: 0;">Savage<span style="color: var(--primary-orange);">Grill.</span> <span style="font-size: 14px; color: var(--text-muted); font-family: sans-serif; letter-spacing: 2px;">| COCINA</span></h1>
        
        <div style="display: flex; align-items: center; gap: 15px;">
            <div id="indicador-conexion" style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #4CAF50; font-weight: bold;">
                <div style="width: 10px; height: 10px; background-color: #4CAF50; border-radius: 50%; box-shadow: 0 0 10px #4CAF50;"></div>
                RabbitMQ Conectado
            </div>
            <!-- Reloj Digital en tiempo real -->
            <span id="reloj-cocina" style="border: 1px solid var(--text-muted); color: var(--text-muted); padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; font-family: monospace;">
                00:00:00
            </span>
        </div>
    </header>

    <!-- ==========================================================================
         TABLERO KANBAN (Gestión de Estados de la Comanda)
         ========================================================================== -->
    <main class="kanban-board">
        
        <!-- Columna 1: Entrantes (Violeta) -->
        <div class="kanban-column" style="border-top: 4px solid #a855f7;">
            <div class="kanban-header" style="color: #a855f7;">NUEVOS PEDIDOS (<span id="contador-pendientes">0</span>)</div>
            <div class="kanban-body" id="columna-pendientes">
                <!-- Inyección dinámica de JS -->
            </div>
        </div>

        <!-- Columna 2: Preparación (Naranja) -->
        <div class="kanban-column" style="border-top: 4px solid #ff7a00;">
            <div class="kanban-header" style="color: #ff7a00;">EN PREPARACIÓN (<span id="contador-proceso">0</span>)</div>
            <div class="kanban-body" id="columna-proceso">
                <!-- Inyección dinámica de JS -->
            </div>
        </div>

        <!-- Columna 3: Despacho (Verde) -->
        <div class="kanban-column" style="border-top: 4px solid #2ecc71;">
            <div class="kanban-header" style="color: #2ecc71;">LISTOS PARA SERVIR (<span id="contador-listos">0</span>)</div>
            <div class="kanban-body" id="columna-listos">
                <!-- Inyección dinámica de JS -->
            </div>
        </div>

    </main>

    <!-- ==========================================================================
         LÓGICA ASÍNCRONA DEL MÓDULO DE COCINA
         ========================================================================== -->
    <script>
        // Contratos de API consensuados con el Backend
        const API_PEDIDOS_URL = 'http://localhost:8080/api/v1/pedidos'; 
        const INTERVALO_POLLING = 5000; // Consulta al servidor cada 5 segundos

        // Estado local de la vista
        let comandas = [];

        // Reloj digital para la cabecera en formato 24hs
        setInterval(() => {
            const ahora = new Date();
            document.getElementById('reloj-cocina').textContent = ahora.toLocaleTimeString('es-AR', { hour12: false });
        }, 1000);

        /* ==========================================================================
           MOTOR DE RENDERIZADO (Actualización del DOM)
           ========================================================================== */
        function renderizarTablero() {
            const colPendientes = document.getElementById('columna-pendientes');
            const colProceso = document.getElementById('columna-proceso');
            const colListos = document.getElementById('columna-listos');
            
            colPendientes.innerHTML = '';
            colProceso.innerHTML = '';
            colListos.innerHTML = '';

            let contPendientes = 0, contProceso = 0, contListos = 0;

            comandas.forEach(comanda => {
                let itemsHTML = '';
                comanda.items.forEach(item => {
                    itemsHTML += `<div class="item-pedido"><span>1x ${item.nombre}</span></div>`;
                });

                let botonesHTML = '';
                if (comanda.estado === 'pendiente') {
                    contPendientes++;
                    botonesHTML = `<button onclick="cambiarEstado('${comanda.id_comanda_uuid}', 'proceso')" style="width: 100%; margin-top: 15px; padding: 10px; background-color: #ff7a00; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: opacity 0.2s;">Comenzar Preparación ➔</button>`;
                } else if (comanda.estado === 'proceso') {
                    contProceso++;
                    botonesHTML = `<button onclick="cambiarEstado('${comanda.id_comanda_uuid}', 'listo')" style="width: 100%; margin-top: 15px; padding: 10px; background-color: #2ecc71; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: opacity 0.2s;">✔ Marcar como Listo</button>`;
                } else if (comanda.estado === 'listo') {
                    contListos++;
                    botonesHTML = `<button onclick="cambiarEstado('${comanda.id_comanda_uuid}', 'entregado')" style="width: 100%; margin-top: 15px; padding: 10px; background-color: transparent; color: var(--text-muted); border: 1px solid var(--text-muted); border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.1)'" onmouseout="this.style.background='transparent'">Despachado (Ocultar)</button>`;
                }

                const tarjeta = document.createElement('div');
                tarjeta.className = 'comanda-card';
                tarjeta.innerHTML = `
                    <div class="comanda-header">
                        <span class="mesa-badge">Mesa #${comanda.mesa_id}</span>
                        <span class="tiempo-badge">⏱ ${new Date(comanda.timestamp).toLocaleTimeString('es-AR', {hour: '2-digit', minute:'2-digit', hour12: false})}</span>
                    </div>
                    <div style="margin-bottom: 10px;">
                        ${itemsHTML}
                    </div>
                    <div style="font-size: 11px; color: var(--text-muted); border-top: 1px solid rgba(255,255,255,0.05); padding-top: 8px; margin-top: 8px;">
                        Ref: ${comanda.id_comanda_uuid ? comanda.id_comanda_uuid.substring(0,8) : 'N/A'}...
                    </div>
                    ${botonesHTML}
                `;

                if (comanda.estado === 'pendiente') colPendientes.appendChild(tarjeta);
                if (comanda.estado === 'proceso') colProceso.appendChild(tarjeta);
                if (comanda.estado === 'listo') colListos.appendChild(tarjeta);
            });

            document.getElementById('contador-pendientes').textContent = contPendientes;
            document.getElementById('contador-proceso').textContent = contProceso;
            document.getElementById('contador-listos').textContent = contListos;
        }

        /* ==========================================================================
           INTEGRACIÓN REST (Comunicación con Backend)
           ========================================================================== */
        
        // Petición GET periódica para sincronizar la vista con RabbitMQ
        async function sincronizarComandas() {
            try {
                const respuesta = await fetch(API_PEDIDOS_URL);
                if (respuesta.ok) {
                    comandas = await respuesta.json();
                    renderizarTablero();
                    document.getElementById('indicador-conexion').innerHTML = '<div style="width: 10px; height: 10px; background-color: #4CAF50; border-radius: 50%; box-shadow: 0 0 10px #4CAF50;"></div> RabbitMQ Sincronizado';
                }
            } catch (error) {
                console.error("Fallo de conexión con el backend:", error);
                document.getElementById('indicador-conexion').innerHTML = '<div style="width: 10px; height: 10px; background-color: #e74c3c; border-radius: 50%; box-shadow: 0 0 10px #e74c3c;"></div> Backend Desconectado';
            }
        }

        // Petición PATCH para avanzar el flujo de la orden
        async function cambiarEstado(idComanda, nuevoEstado) {
            // Actualización optimista de UI local
            const index = comandas.findIndex(c => c.id_comanda_uuid === idComanda);
            const estadoAnterior = comandas[index].estado;
            
            if (nuevoEstado === 'entregado') {
                comandas.splice(index, 1);
            } else {
                comandas[index].estado = nuevoEstado;
            }
            renderizarTablero();

            try {
                const respuesta = await fetch(`${API_PEDIDOS_URL}/${idComanda}/estado`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ estado: nuevoEstado })
                });
                
                if (!respuesta.ok) throw new Error("Rechazo del servidor");
            } catch (error) {
                console.error("Fallo al actualizar estado. Realizando Rollback visual:", error);
                // Si el servidor falla, revertimos la tarjeta a su estado original
                if (nuevoEstado !== 'entregado') {
                    comandas[index].estado = estadoAnterior;
                    renderizarTablero();
                }
            }
        }

        // Inicialización y ciclo asíncrono
        sincronizarComandas();
        setInterval(sincronizarComandas, INTERVALO_POLLING);
    </script>
    <script>
        // Inyector local de Modo Claro/Oscuro
        document.addEventListener('DOMContentLoaded', () => {
            const temaGuardado = localStorage.getItem('savage-tema');
            if (temaGuardado === 'light') document.body.classList.add('light-mode');

            const btnTema = document.createElement('button');
            btnTema.className = 'btn-tema';
            
            const actualizarTexto = () => {
                btnTema.innerHTML = document.body.classList.contains('light-mode') ? 'Modo: Claro' : 'Modo: Oscuro';
            };
            
            actualizarTexto();
            
            btnTema.onclick = () => {
                document.body.classList.toggle('light-mode');
                actualizarTexto();
                localStorage.setItem('savage-tema', document.body.classList.contains('light-mode') ? 'light' : 'dark');
            };
            
            document.body.appendChild(btnTema);
        });
    </script>
</body>
</html>
