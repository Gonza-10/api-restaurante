<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas - Savage Grill</title>
    <script>if (/[?&]embebido=1/.test(location.search) && window.parent !== window) document.documentElement.classList.add("sg-embebido");</script>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="savage-theme.css">
    <script defer src="savage-theme.js"></script>
    <link rel="stylesheet" href="savage-brand-unificado.css">
    <link rel="stylesheet" href="savage-logout.css">
    <link rel="stylesheet" href="savage-modal-lock.css">
    <link rel="stylesheet" href="savage-ui.css">
    <style>
        .rv-filtros { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-bottom: 12px; }
        .rv-grupo { display: grid; gap: 10px; }
        .rv-grupo + .rv-grupo { margin-top: 18px; }
        .rv-grupo-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-bottom: 6px; border-bottom: 1px solid var(--glass-border); }
        .rv-grupo-cab strong { font-size: 15px; font-weight: 900; }
        .rv-grupo-cab span { font-size: 12px; font-weight: 700; color: var(--text-muted); }
        .rv-res { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--glass-border); border-radius: 12px; background: rgba(255,255,255,.03); }
        body.light-mode .rv-res { background: #fff; border-color: #d6dce5; }
        .rv-res.apagada { opacity: .75; }
        .rv-res-fila { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        .rv-hora { font-size: 20px; font-weight: 900; color: var(--primary-orange); font-variant-numeric: tabular-nums; line-height: 1.1; }
        .rv-quien { min-width: 0; }
        .rv-quien strong { display: block; font-size: 15px; font-weight: 800; overflow-wrap: anywhere; }
        .rv-quien small { display: block; color: var(--text-muted); font-size: 12.5px; margin-top: 2px; overflow-wrap: anywhere; }
        .rv-izq { display: flex; gap: 14px; align-items: flex-start; min-width: 0; }
        .rv-datos { display: flex; flex-wrap: wrap; gap: 6px; }
        .rv-nota { font-size: 13px; color: var(--text-muted); line-height: 1.45; overflow-wrap: anywhere; }
        .rv-acciones { display: flex; gap: 8px; flex-wrap: wrap; }
        .rv-mesas { display: flex; flex-wrap: wrap; gap: 8px; }
        .rv-mesas .sg-chip { padding: 8px 12px; font-size: 13px; }
        .rv-ayuda { font-size: 12px; color: var(--text-muted); margin-top: 4px; line-height: 1.4; }
        @media (max-width: 720px) { .rv-izq { flex-direction: column; gap: 4px; } }
    </style>
</head>
<body class="sg-body" style="background-color: var(--bg-dark); color: var(--text-main); margin: 0;">

    <header class="sg-top">
        <div class="sg-top-izq">
            <a id="sg-volver" class="sg-btn chico" href="login.html"><span data-ico="volver"></span><span>Volver a mi panel</span></a>
        </div>
        <div class="sg-top-centro">
            <h1 class="logo-restaurante sg-brand-unified">SAVAGE<span>GRILL.</span></h1>
            <div class="sg-role-unified">RESERVAS</div>
        </div>
        <div class="sg-top-der">
            <div data-savage-theme="inline"></div>
            <button id="sg-salir" type="button" class="sg-logout-unificado"><span data-ico="salir"></span><span>Cerrar sesión</span></button>
        </div>
    </header>

    <main class="sg-page">
        <div class="sg-grid lado" id="rv-grid">
            <!-- ============ LISTA ============ -->
            <div class="sg-col">
                <div class="sg-box">
                    <div class="sg-box-cab"><h2>Reservas</h2><span id="rv-cont" class="sg-badge neutro">0</span></div>
                    <div class="sg-segmentos" id="rv-rango" style="margin-bottom:14px" role="group" aria-label="Período">
                        <button type="button" class="sg-chip activo" data-r="hoy">Hoy</button>
                        <button type="button" class="sg-chip" data-r="manana">Mañana</button>
                        <button type="button" class="sg-chip" data-r="semana">Próximos 7 días</button>
                        <button type="button" class="sg-chip" data-r="todas">Todas desde hoy</button>
                    </div>
                    <div class="rv-filtros">
                        <div class="sg-campo" style="grid-column:1/-1"><label for="rv-f-fecha">Fecha exacta (opcional)</label><input id="rv-f-fecha" class="sg-input" type="date"></div>
                        <div class="sg-campo"><label for="rv-f-turno">Turno</label><select id="rv-f-turno" data-sg-select></select></div>
                        <div class="sg-campo"><label for="rv-f-estado">Estado</label><select id="rv-f-estado" data-sg-select></select></div>
                    </div>
                    <div class="sg-campo" style="margin-bottom:16px">
                        <label for="rv-buscar" class="sg-sr">Buscar reserva</label>
                        <input id="rv-buscar" class="sg-input" type="search" placeholder="Buscar por nombre, apellido, teléfono o mesa" autocomplete="off">
                    </div>
                    <div id="rv-lista" aria-live="polite"></div>
                </div>
            </div>

            <!-- ============ FORMULARIO (solo Administración y Gerencia) ============ -->
            <div class="sg-col" id="rv-col-form">
                <div class="sg-box" id="rv-form-box">
                    <div class="sg-box-cab"><h2 id="rv-form-titulo">Nueva reserva</h2></div>
                    <p class="sg-nota" id="rv-form-nota">Cargá los datos de quien reserva. Si no elegís una mesa, el sistema asigna la más chica que alcance.</p>
                    <form id="rv-form" novalidate autocomplete="off">
                        <div class="sg-fila" style="margin-bottom:14px">
                            <div class="sg-campo"><label for="rv-fecha">Fecha</label><input id="rv-fecha" class="sg-input" type="date" required></div>
                            <div class="sg-campo"><label for="rv-turno">Turno</label><select id="rv-turno" data-sg-select></select></div>
                        </div>
                        <div class="sg-fila" style="margin-bottom:6px">
                            <div class="sg-campo"><label for="rv-hora">Hora de llegada</label><input id="rv-hora" class="sg-input" type="time" required></div>
                            <div class="sg-campo"><label for="rv-personas">Cantidad de personas</label><input id="rv-personas" class="sg-input" type="number" min="1" max="100" inputmode="numeric" required></div>
                        </div>
                        <div class="rv-ayuda" id="rv-turno-ayuda" style="margin-bottom:14px"></div>

                        <div class="sg-campo" style="margin-bottom:14px">
                            <label>Mesa</label>
                            <div id="rv-mesas" class="rv-mesas" role="group" aria-label="Mesa de la reserva"></div>
                            <div class="rv-ayuda" id="rv-mesas-ayuda"></div>
                        </div>

                        <div class="sg-fila" style="margin-bottom:14px">
                            <div class="sg-campo"><label for="rv-nombre">Nombre</label><input id="rv-nombre" class="sg-input" type="text" maxlength="80" required></div>
                            <div class="sg-campo"><label for="rv-apellido">Apellido</label><input id="rv-apellido" class="sg-input" type="text" maxlength="80" required></div>
                        </div>
                        <div class="sg-fila" style="margin-bottom:14px">
                            <div class="sg-campo"><label for="rv-telefono">Teléfono</label><input id="rv-telefono" class="sg-input" type="tel" maxlength="20" inputmode="tel" placeholder="Ej.: 376 4123456" required></div>
                            <div class="sg-campo"><label for="rv-origen">¿Cómo reservó?</label><select id="rv-origen" data-sg-select></select></div>
                        </div>
                        <div class="sg-campo" style="margin-bottom:14px">
                            <label for="rv-notas">Notas (opcional)</label>
                            <textarea id="rv-notas" class="sg-input" maxlength="300" rows="2" placeholder="Ej.: cumpleaños, silla para bebé, prefiere la terraza"></textarea>
                        </div>
                        <div id="rv-error" class="sg-notice mal" role="alert" hidden></div>
                        <div class="sg-botones" style="margin-top:6px">
                            <button type="submit" id="rv-guardar" class="sg-btn principal">Guardar reserva</button>
                            <button type="button" id="rv-descartar" class="sg-btn" hidden>Cancelar edición</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="savage-ui.js"></script>
    <script>
    (function () {
        'use strict';
        if (!SG.exigirRol(['Mozo', 'Admin', 'Gerente'])) return;
        SG.iniciarCabecera();
        const GESTIONA = SG.esAdminGerente();
        const ESTADOS = ['Confirmada', 'Cancelada', 'Cumplida', 'No se presentó'];
        const ESTADO_BADGE = { 'Confirmada': 'naranja', 'Cumplida': 'ok', 'Cancelada': 'mal', 'No se presentó': 'aviso' };
        const ORIGENES = ['Llamada', 'Mensaje', 'Otro'];

        let turnos = [];
        let reservas = [];
        let editando = null;           // reserva que se está editando
        let mesaElegida = null;        // null = que el sistema elija
        let disponibles = { mesas: [], sugerida: null };
        let rango = 'hoy';
        const $ = SG.$;

        /* ---------- Mozo: solo consulta ---------- */
        if (!GESTIONA) {
            $('#rv-col-form').hidden = true;
            $('#rv-grid').classList.remove('lado');
            $('#rv-lista').insertAdjacentHTML('beforebegin', '<p class="sg-nota">Acá ves las reservas del salón. Las carga y modifica Administración o Gerencia.</p>');
        }

        /* ---------- Utilidades ---------- */
        function sumarDias(iso, n) {
            const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }
        function diaLargo(iso) {
            const d = new Date(iso + 'T12:00:00');
            const t = d.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
            return t.charAt(0).toUpperCase() + t.slice(1);
        }
        function turnoPorId(id) { return turnos.find((t) => String(t.id) === String(id)); }
        function mostrarError(texto) {
            const e = $('#rv-error');
            e.hidden = !texto;
            e.innerHTML = texto ? `${SG.ico('alerta')}<div>${SG.esc(texto)}</div>` : '';
            if (texto) e.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }

        /* ---------- Filtros ---------- */
        function cargarFiltros() {
            SG.llenarSelect($('#rv-f-turno'), turnos.map((t) => ({ valor: t.id, texto: t.nombre })), { vacio: 'Todos', valor: '' });
            SG.llenarSelect($('#rv-f-estado'), [{ valor: 'todos', texto: 'Todos' }, ...ESTADOS.map((e) => ({ valor: e, texto: e }))], { valor: 'Confirmada' });
            SG.selectsEn();
        }
        function parametros() {
            const p = new URLSearchParams();
            const fecha = $('#rv-f-fecha').value;
            const hoy = SG.hoy();
            if (fecha) p.set('fecha', fecha);
            else if (rango === 'hoy') p.set('fecha', hoy);
            else if (rango === 'manana') p.set('fecha', sumarDias(hoy, 1));
            else if (rango === 'semana') { p.set('desde', hoy); p.set('hasta', sumarDias(hoy, 6)); }
            else p.set('desde', hoy);
            const t = $('#rv-f-turno').value; if (t) p.set('turno', t);
            const e = $('#rv-f-estado').value; if (e && e !== 'todos') p.set('estado', e);
            return p.toString();
        }
        SG.$$('#rv-rango [data-r]').forEach((b) => b.addEventListener('click', () => {
            rango = b.dataset.r; $('#rv-f-fecha').value = '';
            SG.$$('#rv-rango [data-r]').forEach((o) => o.classList.toggle('activo', o === b));
            cargarLista();
        }));
        $('#rv-f-fecha').addEventListener('change', () => {
            SG.$$('#rv-rango [data-r]').forEach((o) => o.classList.toggle('activo', !$('#rv-f-fecha').value && o.dataset.r === rango));
            cargarLista();
        });
        $('#rv-f-turno').addEventListener('change', cargarLista);
        $('#rv-f-estado').addEventListener('change', cargarLista);
        $('#rv-buscar').addEventListener('input', SG.debounce(pintarLista, 120));

        /* ---------- Lista ---------- */
        async function cargarLista() {
            const r = await SG.api('/reservas?' + parametros(), { auth: true });
            if (!r.ok) { $('#rv-lista').innerHTML = `<div class="sg-notice mal">${SG.ico('alerta')}<div>${SG.esc(r.error || 'No se pudieron cargar las reservas.')}</div></div>`; return; }
            reservas = Array.isArray(r.data) ? r.data : [];
            pintarLista();
        }
        function visibles() {
            const q = $('#rv-buscar').value.trim().toLowerCase();
            if (!q) return reservas;
            return reservas.filter((x) => [x.nombre, x.apellido, x.telefono, x.numero_mesa != null ? 'mesa ' + x.numero_mesa : '', x.notas].join(' ').toLowerCase().includes(q));
        }
        function tarjeta(x) {
            const apagada = x.estado !== 'Confirmada';
            const mesa = x.numero_mesa != null ? `<span class="sg-badge neutro">Mesa ${SG.esc(x.numero_mesa)}</span>` : '<span class="sg-badge aviso">Sin mesa</span>';
            const acciones = GESTIONA && x.estado === 'Confirmada'
                ? `<div class="rv-acciones"><button type="button" class="sg-btn chico" data-edit="${x.id}"><span>${SG.ico('lapiz')}</span><span>Editar</span></button>
                   <button type="button" class="sg-btn chico peligro" data-cancel="${x.id}">Cancelar reserva</button></div>` : '';
            let detalle = '';
            if (x.estado === 'Confirmada') detalle = `Se la espera hasta las ${SG.esc((x.espera_hasta || '').slice(11, 16) || '--:--')}.`;
            if (x.estado === 'Cancelada' && x.cancelacion) detalle = `Cancelada el ${SG.esc(SG.fechaHora(x.cancelacion.fecha_hora))}${x.cancelacion.por ? ' por ' + SG.esc(x.cancelacion.por) : ''}${x.cancelacion.motivo ? '. Motivo: ' + SG.esc(x.cancelacion.motivo) : '.'}`;
            if (x.estado === 'Cumplida') detalle = 'Los clientes llegaron y se abrió la mesa.';
            if (x.estado === 'No se presentó') detalle = 'Pasó la hora de espera y no llegaron. La mesa quedó libre.';
            return `<article class="rv-res ${apagada ? 'apagada' : ''}">
                <div class="rv-res-fila">
                    <div class="rv-izq"><div class="rv-hora">${SG.esc(x.hora)}</div>
                        <div class="rv-quien"><strong>${SG.esc(x.nombre)} ${SG.esc(x.apellido)}</strong><small>${SG.esc(x.telefono)}${x.origen ? ' · ' + SG.esc(x.origen) : ''}</small></div></div>
                    <span class="sg-badge ${ESTADO_BADGE[x.estado] || 'neutro'}">${SG.esc(x.estado)}</span>
                </div>
                <div class="rv-datos">${mesa}<span class="sg-badge neutro">${SG.esc(x.cantidad_personas)} ${x.cantidad_personas === 1 ? 'persona' : 'personas'}</span></div>
                ${x.notas ? `<div class="rv-nota"><b>Notas:</b> ${SG.esc(x.notas)}</div>` : ''}
                ${detalle ? `<div class="rv-nota">${detalle}</div>` : ''}
                ${acciones}
            </article>`;
        }
        function pintarLista() {
            const lista = visibles();
            $('#rv-cont').textContent = lista.length;
            if (!lista.length) {
                $('#rv-lista').innerHTML = `<div class="sg-vacio">${reservas.length ? 'Ninguna reserva coincide con la búsqueda.' : 'No hay reservas para este período y estos filtros.'}</div>`;
                return;
            }
            const grupos = new Map();
            lista.forEach((x) => { const k = x.fecha + '|' + x.turno.id; if (!grupos.has(k)) grupos.set(k, { fecha: x.fecha, turno: x.turno.nombre, items: [] }); grupos.get(k).items.push(x); });
            $('#rv-lista').innerHTML = Array.from(grupos.values()).map((g) => {
                const personas = g.items.filter((i) => i.estado === 'Confirmada').reduce((s, i) => s + i.cantidad_personas, 0);
                return `<section class="rv-grupo"><div class="rv-grupo-cab"><strong>${SG.esc(diaLargo(g.fecha))} · ${SG.esc(g.turno)}</strong><span>${g.items.length} ${g.items.length === 1 ? 'reserva' : 'reservas'}${personas ? ' · ' + personas + ' personas esperadas' : ''}</span></div>${g.items.map(tarjeta).join('')}</section>`;
            }).join('');
        }
        $('#rv-lista').addEventListener('click', (ev) => {
            const e = ev.target.closest('[data-edit]'); const c = ev.target.closest('[data-cancel]');
            if (e) empezarEdicion(reservas.find((r) => String(r.id) === e.dataset.edit));
            if (c) cancelar(reservas.find((r) => String(r.id) === c.dataset.cancel));
        });
        async function cancelar(x) {
            if (!x) return;
            const ok = await SG.dialogo({
                titulo: 'Cancelar la reserva', peligro: true, icono: 'alerta', aceptar: 'Cancelar reserva', cancelar: 'Volver',
                texto: `Vas a cancelar la reserva de ${x.nombre} ${x.apellido} para el ${SG.fecha(x.fecha)} a las ${x.hora}${x.numero_mesa != null ? ' (mesa ' + x.numero_mesa + ')' : ''}. La mesa queda libre de inmediato y la reserva se guarda en el historial.`,
                motivo: { etiqueta: 'Motivo (opcional)', placeholder: 'Ej.: el cliente avisó que no puede venir', obligatorio: false, max: 200 }
            });
            if (!ok) return;
            const r = await SG.api(`/reservas/${x.id}/cancelar`, { method: 'POST', body: ok.motivo ? { motivo: ok.motivo } : {}, auth: true });
            if (!r.ok) { SG.avisoModal('No se pudo cancelar', r.error || 'Probá de nuevo en unos segundos.'); return; }
            SG.ok('Reserva cancelada.');
            if (editando && editando.id === x.id) salirDeEdicion();
            cargarLista();
        }

        /* ---------- Formulario ---------- */
        if (GESTIONA) {
            const hoy = SG.hoy();
            $('#rv-fecha').min = hoy; $('#rv-fecha').value = hoy;
            SG.llenarSelect($('#rv-origen'), ORIGENES.map((o) => ({ valor: o, texto: o })), { vacio: 'Sin indicar', valor: '' });
        }
        function turnoInicial() {
            const d = new Date(); const ahora = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
            const enCurso = turnos.find((t) => t.hora_cierre > t.hora_apertura ? (ahora >= t.hora_apertura && ahora <= t.hora_cierre) : (ahora >= t.hora_apertura || ahora <= t.hora_cierre));
            const proximo = turnos.find((t) => t.hora_apertura > ahora);
            return (enCurso || proximo || turnos[0] || {}).id;
        }
        function ayudaTurno() {
            const t = turnoPorId($('#rv-turno').value);
            if (!t) { $('#rv-turno-ayuda').textContent = ''; return; }
            $('#rv-turno-ayuda').textContent = `El turno ${t.nombre} va de ${t.hora_apertura} a ${t.hora_cierre}. La hora de llegada tiene que estar dentro de ese horario.`;
            const cruza = t.hora_cierre <= t.hora_apertura;
            const h = $('#rv-hora');
            if (cruza) { h.removeAttribute('min'); h.removeAttribute('max'); } else { h.min = t.hora_apertura; h.max = t.hora_cierre; }
        }
        function pintarMesas() {
            const cont = $('#rv-mesas');
            const f = $('#rv-fecha').value, t = $('#rv-turno').value, p = Number($('#rv-personas').value);
            if (!f || !t || !(p >= 1)) { cont.innerHTML = ''; $('#rv-mesas-ayuda').textContent = 'Completá fecha, turno y cantidad de personas para ver las mesas libres.'; return; }
            let mesas = disponibles.mesas.slice();
            // En edición, la mesa actual de la reserva sigue siendo válida aunque figure como ocupada por ella misma.
            if (editando && editando.numero_mesa != null && String(editando.fecha) === f && String(editando.turno.id) === t && !mesas.some((m) => m.numero === editando.numero_mesa)) {
                mesas.push({ numero: editando.numero_mesa, capacidad: null, actual: true });
                mesas.sort((a, b) => a.numero - b.numero);
            }
            const auto = disponibles.sugerida != null ? `Automática (mesa ${disponibles.sugerida})` : 'Automática';
            cont.innerHTML = `<button type="button" class="sg-chip ${mesaElegida == null ? 'activo' : ''}" data-mesa="">${SG.esc(auto)}</button>` +
                mesas.map((m) => `<button type="button" class="sg-chip ${mesaElegida === m.numero ? 'activo' : ''}" data-mesa="${m.numero}">Mesa ${m.numero}${m.capacidad ? ' · hasta ' + m.capacidad : ' · la actual'}</button>`).join('');
            $('#rv-mesas-ayuda').textContent = mesas.length ? `${mesas.length} ${mesas.length === 1 ? 'mesa libre' : 'mesas libres'} para ${p} ${p === 1 ? 'persona' : 'personas'} en ese turno.` : 'No hay mesas libres para esa cantidad de personas en ese turno y fecha. Probá con otro turno u otra fecha.';
        }
        $('#rv-mesas').addEventListener('click', (ev) => {
            const b = ev.target.closest('[data-mesa]'); if (!b) return;
            mesaElegida = b.dataset.mesa === '' ? null : Number(b.dataset.mesa);
            pintarMesas();
        });
        const pedirDisponibilidad = SG.debounce(async () => {
            const f = $('#rv-fecha').value, t = $('#rv-turno').value, p = Number($('#rv-personas').value);
            if (!f || !t || !(p >= 1)) { disponibles = { mesas: [], sugerida: null }; pintarMesas(); return; }
            const r = await SG.api(`/reservas/disponibilidad?fecha=${encodeURIComponent(f)}&turno=${encodeURIComponent(t)}&personas=${p}`, { auth: true });
            if (r.ok) disponibles = { mesas: r.data.mesas || [], sugerida: r.data.mesa_sugerida ?? null };
            else disponibles = { mesas: [], sugerida: null };
            if (mesaElegida != null && !disponibles.mesas.some((m) => m.numero === mesaElegida) && !(editando && editando.numero_mesa === mesaElegida && String(editando.fecha) === f && String(editando.turno.id) === t)) mesaElegida = null;
            pintarMesas();
        }, 250);
        ['#rv-fecha', '#rv-personas'].forEach((s) => $(s).addEventListener('input', pedirDisponibilidad));
        $('#rv-turno').addEventListener('change', () => { ayudaTurno(); const t = turnoPorId($('#rv-turno').value); if (t && !$('#rv-hora').value) $('#rv-hora').value = t.hora_apertura; pedirDisponibilidad(); });

        function leerForm() {
            return {
                nombre: $('#rv-nombre').value.trim(), apellido: $('#rv-apellido').value.trim(), telefono: $('#rv-telefono').value.trim(),
                fecha: $('#rv-fecha').value, turno: Number($('#rv-turno').value) || null, hora: $('#rv-hora').value,
                cantidad_personas: Number($('#rv-personas').value) || null, numero_mesa: mesaElegida,
                notas: $('#rv-notas').value.trim(), origen: $('#rv-origen').value
            };
        }
        function validar(d) {
            if (!d.fecha) return 'Elegí la fecha de la reserva.';
            if (!d.turno) return 'Elegí el turno.';
            if (!d.hora) return 'Indicá la hora de llegada.';
            if (!d.cantidad_personas || d.cantidad_personas < 1) return 'Indicá cuántas personas vienen.';
            if (!d.nombre) return 'Escribí el nombre de quien reserva.';
            if (!d.apellido) return 'Escribí el apellido de quien reserva.';
            if (!d.telefono) return 'Escribí un teléfono de contacto.';
            return '';
        }
        $('#rv-form').addEventListener('submit', async (ev) => {
            ev.preventDefault();
            mostrarError('');
            const d = leerForm();
            const falta = validar(d);
            if (falta) { mostrarError(falta); return; }
            await SG.conEspera($('#rv-guardar'), async () => {
                let r;
                if (editando) {
                    const o = editando; const cambios = {};
                    const base = { nombre: o.nombre, apellido: o.apellido, telefono: o.telefono, fecha: o.fecha, turno: o.turno.id, hora: o.hora, cantidad_personas: o.cantidad_personas, numero_mesa: o.numero_mesa, notas: o.notas || '', origen: o.origen || '' };
                    Object.keys(base).forEach((k) => { if (d[k] !== base[k]) cambios[k] = d[k]; });
                    if (!Object.keys(cambios).length) { mostrarError('No hiciste ningún cambio.'); return; }
                    if ('origen' in cambios && cambios.origen === '') cambios.origen = null;
                    r = await SG.api(`/reservas/${o.id}`, { method: 'PATCH', body: cambios, auth: true });
                } else {
                    const cuerpo = { ...d };
                    if (cuerpo.numero_mesa == null) delete cuerpo.numero_mesa;
                    if (!cuerpo.notas) delete cuerpo.notas;
                    if (!cuerpo.origen) delete cuerpo.origen;
                    r = await SG.api('/reservas', { method: 'POST', body: cuerpo, auth: true });
                }
                if (!r.ok) { mostrarError(r.error || 'No se pudo guardar la reserva.'); pedirDisponibilidad(); return; }
                const x = r.data;
                SG.ok(editando ? 'Cambios guardados.' : `Reserva guardada: ${x.nombre} ${x.apellido}, ${SG.fecha(x.fecha)} a las ${x.hora}${x.numero_mesa != null ? ', mesa ' + x.numero_mesa : ''}.`);
                limpiarForm();
                // Mostrar la fecha de la reserva recién cargada.
                $('#rv-f-fecha').value = x.fecha;
                SG.$$('#rv-rango [data-r]').forEach((o) => o.classList.remove('activo'));
                await cargarLista();
            });
        });
        function limpiarForm() {
            editando = null; mesaElegida = null; mostrarError('');
            $('#rv-form').reset();
            $('#rv-fecha').value = SG.hoy();
            SG.llenarSelect($('#rv-origen'), ORIGENES.map((o) => ({ valor: o, texto: o })), { vacio: 'Sin indicar', valor: '' });
            if (turnos[0]) SG.llenarSelect($('#rv-turno'), turnos.map((t) => ({ valor: t.id, texto: `${t.nombre} (${t.hora_apertura} a ${t.hora_cierre})` })), { valor: turnoInicial() });
            ayudaTurno(); { const t = turnoPorId($('#rv-turno').value); if (t) $('#rv-hora').value = t.hora_apertura; }
            $('#rv-form-titulo').textContent = 'Nueva reserva';
            $('#rv-form-nota').textContent = 'Cargá los datos de quien reserva. Si no elegís una mesa, el sistema asigna la más chica que alcance.';
            $('#rv-guardar').textContent = 'Guardar reserva'; $('#rv-descartar').hidden = true;
            disponibles = { mesas: [], sugerida: null }; pintarMesas();
        }
        function empezarEdicion(x) {
            if (!x) return;
            editando = x; mesaElegida = x.numero_mesa; mostrarError('');
            $('#rv-nombre').value = x.nombre; $('#rv-apellido').value = x.apellido; $('#rv-telefono').value = x.telefono;
            $('#rv-fecha').value = x.fecha; $('#rv-personas').value = x.cantidad_personas; $('#rv-notas').value = x.notas || '';
            SG.llenarSelect($('#rv-turno'), turnos.map((t) => ({ valor: t.id, texto: `${t.nombre} (${t.hora_apertura} a ${t.hora_cierre})` })), { valor: x.turno.id });
            SG.llenarSelect($('#rv-origen'), ORIGENES.map((o) => ({ valor: o, texto: o })), { vacio: 'Sin indicar', valor: x.origen || '' });
            ayudaTurno(); $('#rv-hora').value = x.hora;
            $('#rv-form-titulo').textContent = 'Editar reserva';
            $('#rv-form-nota').textContent = `Estás editando la reserva de ${x.nombre} ${x.apellido}. Se guardan solo los datos que cambies.`;
            $('#rv-guardar').textContent = 'Guardar cambios'; $('#rv-descartar').hidden = false;
            pedirDisponibilidad();
            $('#rv-form-box').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        function salirDeEdicion() { limpiarForm(); }
        $('#rv-descartar').addEventListener('click', salirDeEdicion);

        /* ---------- Inicio ---------- */
        (async function iniciar() {
            const r = await SG.api('/turnos', { auth: true });
            turnos = r.ok && Array.isArray(r.data) ? r.data.filter((t) => t.activo !== false) : [];
            cargarFiltros();
            if (GESTIONA) {
                if (!turnos.length) mostrarError('No hay turnos configurados. Pedile a Gerencia que cargue al menos uno para poder reservar.');
                limpiarForm();
            }
            SG.sondeo(cargarLista, 30000);
        })();
    })();
    </script>
</body>
</html>
