<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Salón - Savage Grill</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Estilos específicos para el mapa de mesas */
        .salon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            padding: 10px 0;
        }
        .mesa-card {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .mesa-card.libre:hover { 
            transform: translateY(-5px); 
            border-color: #2ecc71;
            background: rgba(46, 204, 113, 0.05);
        }
        .mesa-card.libre { border-color: rgba(46, 204, 113, 0.4); }
        .mesa-card.ocupada { border-color: rgba(231, 76, 60, 0.4); opacity: 0.6; cursor: not-allowed; }

        .mesa-numero { font-size: 36px; font-weight: 900; color: var(--text-main); }
        .mesa-capacidad { font-size: 13px; color: var(--text-muted); }
        
        /* Panel lateral de sesiones */
        .sesiones-panel {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: sticky;
            top: 20px;
        }
        .sesion-card {
            background: #0b0b0b;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .pin-display {
            font-family: monospace;
            font-size: 26px;
            color: var(--primary-orange);
            font-weight: bold;
            letter-spacing: 3px;
        }
        
        /* Top bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 0;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div style="max-width: 1200px; margin: 0 auto; padding: 0 20px;">
        <!-- Barra de navegación -->
        <div class="top-bar">
            <div class="brand">
                <h1 class="logo-restaurante" style="font-size: 26px;">Savage<span style="color: var(--primary-orange);">Grill.</span></h1>
            </div>
            <div style="display: flex; align-items: center; gap: 20px;">
                <span id="nombre-mozo" style="color: var(--text-main); font-size: 15px; font-weight: bold;">Cargando usuario...</span>
                <button onclick="cerrarSesion()" style="background: transparent; color: var(--text-muted); border: 1px solid var(--glass-border); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.2s;" onmouseover="this.style.color='white'; this.style.borderColor='white';" onmouseout="this.style.color='var(--text-muted)'; this.style.borderColor='var(--glass-border)';">
                    Cerrar Sesión
                </button>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 400px; gap: 40px; align-items: start;">
            <!-- MAPA DE MESAS (Izquierda) -->
            <div>
                <h2 style="font-size: 24px; margin-bottom: 5px;">Mapa de Mesas</h2>
                <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 25px;">Hacé clic en una mesa libre para sentar a los clientes.</p>
                <div id="mapa-mesas" class="salon-grid">
                    <p style="color: var(--text-muted);">Cargando mapa interactivo...</p>
                </div>
            </div>

            <!-- MIS SESIONES ACTIVAS (Derecha) -->
            <div class="sesiones-panel">
                <h2 style="font-size: 20px; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px; margin-bottom: 5px;">Mis Mesas Activas</h2>
                <div id="mis-sesiones" style="display: flex; flex-direction: column; gap: 12px;">
                    <p style="color: var(--text-muted); font-size: 14px;">No tenés mesas abiertas en este momento.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL ABRIR MESA -->
    <div id="modal-abrir" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.82); backdrop-filter: blur(8px); z-index: 2500; justify-content: center; align-items: center;">
        <div class="product-card" style="width: min(400px, 90%); padding: 30px; position: relative; border: 1px solid var(--glass-border);">
            <button type="button" onclick="cerrarModalAbrir()" style="position: absolute; top: 15px; right: 15px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 20px;">✕</button>
            
            <h2 style="margin: 0 0 6px 0; color: var(--text-main); font-size: 22px;">Abrir Mesa <span id="span-nro-mesa" style="color: var(--primary-orange);"></span></h2>
            <p style="margin: 0 0 20px 0; color: var(--text-muted); font-size: 14px;">Capacidad de la mesa: <span id="span-capacidad" style="font-weight: bold; color: white;"></span> comensales</p>

            <form id="form-abrir-mesa" style="display: flex; flex-direction: column; gap: 16px;">
                <input type="hidden" id="input-nro-mesa">
                <input type="hidden" id="input-capacidad-max">

                <div style="display: flex; flex-direction: column; gap: 6px;">
                    <label style="color: #d7d7d7; font-size: 13px; font-weight: 700;">¿Cuántas personas se sientan?</label>
                    <input type="number" id="input-comensales" min="1" required style="width: 100%; height: 52px; padding: 0 16px; border: 1px solid rgba(255, 255, 255, 0.13); border-radius: 12px; background: #0b0b0b; color: white; font-size: 15px; outline: none;">
                </div>

                <div id="error-abrir" class="message error" style="display: none; margin: 0;"></div>

                <button type="submit" id="btn-abrir" style="padding: 14px; border-radius: 12px; font-weight: bold; cursor: pointer; border: none; background: var(--primary-orange); color: white; margin-top: 10px; font-size: 15px;">
                    Generar PIN y Abrir Mesa
                </button>
            </form>
        </div>
    </div>

    <!-- Vinculamos la lógica de seguridad y red global -->
    <script src="app.js"></script>
    
    <!-- Lógica específica del Mozo -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Verificamos que sea un Mozo válido
            const usuario = obtenerUsuarioActual();
            if (!usuario || (usuario.rol !== 'Mozo' && usuario.rol !== 'Admin' && usuario.rol !== 'Gerente')) {
                alert("Acceso denegado. Pantalla exclusiva de salón.");
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('nombre-mozo').textContent = `${usuario.rol}: ${usuario.nombre} ${usuario.apellido}`;
            cargarTablero();
        });

        async function cargarTablero() {
            await Promise.all([cargarMesas(), cargarMisSesiones()]);
        }

        async function cargarMesas() {
            try {
                // apiFetch ya inyecta el token automáticamente gracias a lo que programamos antes
                const resp = await apiFetch('http://localhost:8080/api/v1/mesas');
                const mesas = await resp.json();
                const contenedor = document.getElementById('mapa-mesas');
                contenedor.innerHTML = '';

                mesas.forEach(mesa => {
                    const div = document.createElement('div');
                    div.className = `mesa-card ${mesa.estado ? 'ocupada' : 'libre'}`;
                    div.innerHTML = `
                        <div class="mesa-numero">${mesa.numero}</div>
                        <div class="mesa-capacidad">Máx: ${mesa.capacidad_maxima} pers.</div>
                        <div style="margin-top: 5px; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; background: ${mesa.estado ? 'rgba(231, 76, 60, 0.1)' : 'rgba(46, 204, 113, 0.1)'}; color: ${mesa.estado ? '#e74c3c' : '#2ecc71'}">
                            ${mesa.estado ? 'OCUPADA' : 'LIBRE'}
                        </div>
                    `;
                    if (!mesa.estado) {
                        div.onclick = () => abrirModalMesa(mesa);
                    }
                    contenedor.appendChild(div);
                });
            } catch (error) {
                document.getElementById('mapa-mesas').innerHTML = '<p style="color: var(--error);">Error al cargar las mesas.</p>';
            }
        }

        async function cargarMisSesiones() {
            try {
                // Filtramos solo las sesiones abiertas (no traemos las cerradas/pagadas)
                const resp = await apiFetch('http://localhost:8080/api/v1/sesiones-mesa?estado=Abierto');
                const sesiones = await resp.json();
                const contenedor = document.getElementById('mis-sesiones');
                
                if (sesiones.length === 0) {
                    contenedor.innerHTML = '<p style="color: var(--text-muted); font-size: 14px;">No tenés mesas abiertas en este momento.</p>';
                    return;
                }

                contenedor.innerHTML = '';
                sesiones.forEach(s => {
                    const div = document.createElement('div');
                    div.className = 'sesion-card';
                    div.innerHTML = `
                        <div>
                            <div style="color: var(--text-main); font-weight: bold; font-size: 18px;">Mesa ${s.numero_mesa}</div>
                            <div style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">👤 ${s.cantidad_comensales} personas</div>
                        </div>
                        <div style="text-align: center; border-left: 1px solid rgba(255,255,255,0.1); border-right: 1px solid rgba(255,255,255,0.1); padding: 0 15px;">
                            <div style="font-size: 10px; color: var(--text-muted); text-transform: uppercase;">PIN Cliente</div>
                            <div class="pin-display">${s.codigo_pin}</div>
                        </div>
                        <button onclick="cerrarMesa(${s.id})" style="background: transparent; color: #e74c3c; border: 1px solid rgba(231, 76, 60, 0.3); padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.2s;" onmouseover="this.style.background='rgba(231, 76, 60, 0.1)'" onmouseout="this.style.background='transparent'">
                            Cerrar
                        </button>
                    `;
                    contenedor.appendChild(div);
                });
            } catch (error) {
                console.error("Error al cargar sesiones activas.");
            }
        }

        // --- MANEJO DEL MODAL ---
        function abrirModalMesa(mesa) {
            document.getElementById('span-nro-mesa').textContent = mesa.numero;
            document.getElementById('span-capacidad').textContent = mesa.capacidad_maxima;
            document.getElementById('input-nro-mesa').value = mesa.numero;
            document.getElementById('input-capacidad-max').value = mesa.capacidad_maxima;
            document.getElementById('input-comensales').value = '';
            document.getElementById('error-abrir').style.display = 'none';
            document.getElementById('modal-abrir').style.display = 'flex';
            setTimeout(() => document.getElementById('input-comensales').focus(), 100);
        }

        function cerrarModalAbrir() {
            document.getElementById('modal-abrir').style.display = 'none';
        }

        document.getElementById('form-abrir-mesa').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nroMesa = parseInt(document.getElementById('input-nro-mesa').value);
            const comensales = parseInt(document.getElementById('input-comensales').value);
            const max = parseInt(document.getElementById('input-capacidad-max').value);
            const errorBox = document.getElementById('error-abrir');
            const btn = document.getElementById('btn-abrir');

            // Validación de capacidad en el front
            if (comensales > max) {
                errorBox.textContent = `Error: La mesa admite un máximo de ${max} comensales.`;
                errorBox.style.display = 'flex';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Procesando...';
            errorBox.style.display = 'none';

            try {
                const resp = await apiFetch('http://localhost:8080/api/v1/sesiones-mesa/abrir', {
                    method: 'POST',
                    body: JSON.stringify({ numero_mesa: nroMesa, cantidad_comensales: comensales })
                });

                if (resp.status === 201) {
                    const data = await resp.json();
                    cerrarModalAbrir();
                    cargarTablero(); 
                    
                    // Alerta visual para que el mozo no se olvide el PIN
                    setTimeout(() => alert(`¡ÉXITO!\nMesa ${nroMesa} abierta correctamente.\n\nEl PIN para el cliente es:  [ ${data.codigo_pin} ]\n\nDictale este PIN al cliente para que ingrese desde su celular.`), 200);
                } else {
                    const err = await resp.json().catch(()=>({}));
                    errorBox.textContent = err.error || "La mesa ya se encuentra ocupada.";
                    errorBox.style.display = 'flex';
                }
            } catch (error) {
                errorBox.textContent = "Error de red al intentar abrir la mesa.";
                errorBox.style.display = 'flex';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Generar PIN y Abrir Mesa';
            }
        });

        async function cerrarMesa(idSesion) {
            if(!confirm("¿Estás seguro de CERRAR esta mesa?\nEl cliente será desconectado y no podrá seguir pidiendo.")) return;
            
            try {
                const resp = await apiFetch(`http://localhost:8080/api/v1/sesiones-mesa/${idSesion}/cerrar`, {
                    method: 'POST'
                });
                
                if (resp.ok) {
                    cargarTablero(); // Se refresca el mapa entero
                } else {
                    const err = await resp.json().catch(()=>({}));
                    alert(err.error || "No se pudo cerrar la mesa.");
                }
            } catch (error) {
                alert("Fallo de conexión al servidor.");
            }
        }
    </script>
</body>
</html>
