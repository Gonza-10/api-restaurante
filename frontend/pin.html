<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso a Mesa - Savage Grill</title>
    <!-- Reutilizamos el archivo de estilos centralizado -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="login-page">
        <div class="login-shell" style="grid-template-columns: 1fr; max-width: 500px; min-height: auto;">
            
            <div class="form-panel" style="padding: 60px 40px; border-radius: var(--radius-xl);">
                <div class="login-card" style="width: 100%; border: none; box-shadow: none; background: transparent;">
                    
                    <div class="login-header">
                        <div class="brand" style="margin: 0 auto 20px;">
                            <h1 class="logo-restaurante">Savage<span style="color: var(--primary-orange);">Grill.</span></h1>
                        </div>
                        <h2>Acceso a tu Mesa</h2>
                        <p>Ingresá el PIN de 4 dígitos que te proporcionó el mozo al abrir tu mesa.</p>
                    </div>

                    <form id="formulario-login" style="margin-top: 40px;">
                        
                        <fieldset class="pin-fieldset">
                            <legend style="text-align: center;">PIN DE MESA</legend>
                            <div class="pin-group" id="pin-container">
                                <!-- Inputs limitados a 1 solo número -->
                                <input type="text" class="pin-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required autofocus>
                                <input type="text" class="pin-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                                <input type="text" class="pin-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                                <input type="text" class="pin-input" maxlength="1" pattern="[0-9]" inputmode="numeric" required>
                            </div>
                        </fieldset>
                        
                        <div id="login-error" class="message error" style="display: none; justify-content: center; margin-top: 10px;">PIN incorrecto o mesa no habilitada.</div>

                        <button type="submit" class="btn-primary" style="margin-top: 30px;">
                            Ingresar al Menú <span class="btn-arrow">→</span>
                        </button>
                    </form>

                    <div style="margin-top: 30px; text-align: center; color: var(--text-muted); font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 8px;">
                        <div style="width: 8px; height: 8px; background-color: var(--success); border-radius: 50%;"></div>
                        <span>Sistema conectado al servidor local</span>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Lógica para saltar automáticamente de casillero y soporte para pegar
        const pinInputs = document.querySelectorAll('.pin-input');
        
        pinInputs.forEach((input, index) => {
            // Al escribir, salta al siguiente
            input.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, ''); // Solo números
                if (this.value.length === 1 && index < pinInputs.length - 1) {
                    pinInputs[index + 1].focus();
                }
            });

            // Al borrar (Backspace), vuelve al anterior
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && this.value.length === 0 && index > 0) {
                    pinInputs[index - 1].focus();
                }
            });

            // Soporte por si el cliente pega (Ctrl+V) el PIN completo
            input.addEventListener('paste', function(e) {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '').slice(0, 4);
                pastedData.split('').forEach((char, i) => {
                    if (pinInputs[i]) {
                        pinInputs[i].value = char;
                        if (i < 3) pinInputs[i + 1].focus();
                    }
                });
            });
        });

        // 2. Envío del PIN al backend para validación real
        document.getElementById('formulario-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const errorBox = document.getElementById('login-error');
            const btnSubmit = document.querySelector('.btn-primary');
            errorBox.style.display = 'none';
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = 'Verificando...';

            // Recolectamos los 4 dígitos
            let pinIngresado = '';
            pinInputs.forEach(input => pinIngresado += input.value);

            try {
                // Hacemos el POST al endpoint de acceso
                const respuesta = await fetch('http://localhost:8080/api/v1/acceso-mesa', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pin: pinIngresado })
                });

                if (respuesta.status === 200) {
                    const data = await respuesta.json();
                    
                    // Guardamos los datos de la sesión real en el navegador
                    sessionStorage.setItem('savage-mesa-numero', data.numero_mesa);
                    sessionStorage.setItem('savage-mesa-pin', pinIngresado);
                    sessionStorage.setItem('savage-comensales', data.cantidad_comensales);
                    
                    // Redirección al catálogo
                    window.location.href = 'catalogo.html';
                } else if (respuesta.status === 429) {
                    const err = await respuesta.json();
                    errorBox.textContent = err.error || "Demasiados intentos. Esperá unos minutos.";
                    errorBox.style.display = 'flex';
                } else {
                    errorBox.textContent = "PIN incorrecto o mesa sin sesión abierta.";
                    errorBox.style.display = 'flex';
                }
            } catch (error) {
                errorBox.textContent = "Error de conexión con el servidor.";
                errorBox.style.display = 'flex';
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = 'Ingresar al Menú <span class="btn-arrow">→</span>';
            }
        });
    </script>
    <script>
        // Inyector local de Modo Claro/Oscuro
        document.addEventListener('DOMContentLoaded', () => {
            const temaGuardado = localStorage.getItem('savage-tema');
            if (temaGuardado === 'light') document.body.classList.add('light-mode');

            const btnTema = document.createElement('button');
            btnTema.className = 'btn-tema';
            
            const actualizarTexto = () => {
                btnTema.innerHTML = document.body.classList.contains('light-mode') ? 'Modo: Claro' : 'Modo: Oscuro';
            };
            
            actualizarTexto();
            
            btnTema.onclick = () => {
                document.body.classList.toggle('light-mode');
                actualizarTexto();
                localStorage.setItem('savage-tema', document.body.classList.contains('light-mode') ? 'light' : 'dark');
            };
            
            document.body.appendChild(btnTema);
        });
    </script>
</body>
</html>
